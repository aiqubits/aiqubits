<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">AIQUBITS commit signal</title>
  <desc id="desc">Animated contribution field inspired by GitHub contribution motion, with interactive hover focus and a scanning signal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0a1512"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39ff88" stop-opacity="0"/><stop offset=".5" stop-color="#39ff88" stop-opacity=".95"/><stop offset="1" stop-color="#39ff88" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cell{fill:#161b22;stroke:#21262d;stroke-width:1;transition:.16s ease;transform-box:fill-box;transform-origin:center}
      .cell.l1{fill:#0e4429}.cell.l2{fill:#006d32}.cell.l3{fill:#26a641}.cell.l4{fill:#39d353}
      .cell:hover{fill:#7ee787;stroke:#b7ffc9;filter:url(#glow);transform:scale(1.22)}
      .legend{fill:#8b949e;font-size:11px}.head{fill:#39ff88;font-size:15px}.sub{fill:#484f58;font-size:11px}
      .trace{stroke:#39ff88;stroke-width:1.5;stroke-dasharray:5 10;opacity:.35;animation:dash 4s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-60}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)" stroke="#30363d"/>
  <text x="30" y="38" class="head">/COMMIT/SIGNAL</text>
  <text x="1170" y="38" text-anchor="end" class="sub">CONTRIBUTION FIELD · HOVER TO FOCUS · CLICK TO OPEN HISTORY</text>

  <g transform="translate(58 76)">
    <path class="trace" d="M0 80 C150 0 260 150 420 65 S735 10 910 90 S1060 140 1080 35" fill="none"/>

    <!-- 28 columns × 7 rows, stylized contribution field -->
    <g>
      <!-- column 1-7 -->
      <rect class="cell" x="0" y="0" width="18" height="18" rx="3"/><rect class="cell l1" x="0" y="24" width="18" height="18" rx="3"/><rect class="cell" x="0" y="48" width="18" height="18" rx="3"/><rect class="cell l2" x="0" y="72" width="18" height="18" rx="3"/><rect class="cell" x="0" y="96" width="18" height="18" rx="3"/><rect class="cell" x="0" y="120" width="18" height="18" rx="3"/><rect class="cell" x="0" y="144" width="18" height="18" rx="3"/>
      <rect class="cell l1" x="24" y="0" width="18" height="18" rx="3"/><rect class="cell" x="24" y="24" width="18" height="18" rx="3"/><rect class="cell l2" x="24" y="48" width="18" height="18" rx="3"/><rect class="cell" x="24" y="72" width="18" height="18" rx="3"/><rect class="cell l3" x="24" y="96" width="18" height="18" rx="3"/><rect class="cell" x="24" y="120" width="18" height="18" rx="3"/><rect class="cell l1" x="24" y="144" width="18" height="18" rx="3"/>
      <rect class="cell" x="48" y="0" width="18" height="18" rx="3"/><rect class="cell l2" x="48" y="24" width="18" height="18" rx="3"/><rect class="cell" x="48" y="48" width="18" height="18" rx="3"/><rect class="cell l4" x="48" y="72" width="18" height="18" rx="3"/><rect class="cell l1" x="48" y="96" width="18" height="18" rx="3"/><rect class="cell" x="48" y="120" width="18" height="18" rx="3"/><rect class="cell" x="48" y="144" width="18" height="18" rx="3"/>
    </g>

    <!-- repeated field using use-like manual pattern -->
    <g id="blockA" transform="translate(84 0)">
      <rect class="cell l1" x="0" y="0" width="18" height="18" rx="3"/><rect class="cell l3" x="0" y="24" width="18" height="18" rx="3"/><rect class="cell l2" x="0" y="48" width="18" height="18" rx="3"/><rect class="cell" x="0" y="72" width="18" height="18" rx="3"/><rect class="cell l1" x="0" y="96" width="18" height="18" rx="3"/><rect class="cell l2" x="0" y="120" width="18" height="18" rx="3"/><rect class="cell" x="0" y="144" width="18" height="18" rx="3"/>
      <rect class="cell l2" x="24" y="0" width="18" height="18" rx="3"/><rect class="cell" x="24" y="24" width="18" height="18" rx="3"/><rect class="cell l4" x="24" y="48" width="18" height="18" rx="3"/><rect class="cell l3" x="24" y="72" width="18" height="18" rx="3"/><rect class="cell" x="24" y="96" width="18" height="18" rx="3"/><rect class="cell l1" x="24" y="120" width="18" height="18" rx="3"/><rect class="cell l2" x="24" y="144" width="18" height="18" rx="3"/>
      <rect class="cell" x="48" y="0" width="18" height="18" rx="3"/><rect class="cell l1" x="48" y="24" width="18" height="18" rx="3"/><rect class="cell l2" x="48" y="48" width="18" height="18" rx="3"/><rect class="cell l4" x="48" y="72" width="18" height="18" rx="3"/><rect class="cell l2" x="48" y="96" width="18" height="18" rx="3"/><rect class="cell" x="48" y="120" width="18" height="18" rx="3"/><rect class="cell l1" x="48" y="144" width="18" height="18" rx="3"/>
    </g>

    <use href="#blockA" x="84"/><use href="#blockA" x="168"/><use href="#blockA" x="252"/><use href="#blockA" x="336"/><use href="#blockA" x="420"/><use href="#blockA" x="504"/><use href="#blockA" x="588"/><use href="#blockA" x="672"/><use href="#blockA" x="756"/>

    <rect x="-24" y="-6" width="70" height="168" fill="url(#scan)" opacity=".18">
      <animate attributeName="x" values="-80;1050" dur="6s" repeatCount="indefinite"/>
    </rect>

    <circle cx="190" cy="56" r="5" fill="#7ee787"><animate attributeName="r" values="4;8;4" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="104" r="5" fill="#58a6ff"><animate attributeName="r" values="4;8;4" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="945" cy="32" r="5" fill="#7ee787"><animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <text x="60" y="270" class="legend">signal density → engineering motion</text>
  <text x="1140" y="270" text-anchor="end" class="legend">hover cells · click field</text>
</svg>