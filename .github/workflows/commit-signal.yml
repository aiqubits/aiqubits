name: Update profile signal

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'assets/ferris-flat-noshadow.svg'
      - '.github/scripts/generate_commit_signal.py'
      - '.github/scripts/test_generate_commit_signal.py'
      - '.github/workflows/commit-signal.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: profile-signal-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate live profile signal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: aiqubits
          OUTPUT: assets/profile-signal.svg
          README_PATH: README.md
        run: python .github/scripts/generate_commit_signal.py
      - name: Test generated profile signal
        run: python .github/scripts/test_generate_commit_signal.py
      - name: Commit updated signal
        run: |
          if git diff --quiet -- assets/profile-signal.svg README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/profile-signal.svg README.md
          git commit -m 'chore(profile): refresh live profile signal [skip ci]'
          git pull --rebase origin main
          git push
